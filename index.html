<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2F3EF; --paper-raised: #FFFFFF; --ink: #17233D; --ink-soft: #4A5670;
    --ink-faint: #8791A3; --line: #DADFE0; --pine: #1F6F6B; --pine-soft: #E4F0EE;
    --ochre: #C77D2E; --ochre-soft: #FBEEDD; --done: #3D7A4E; --done-soft: #E6F1E7;
    --danger: #B4483A; --easy: #3D7A4E; --easy-soft: #E6F1E7; --medium: #B8862F; --medium-soft: #FBF1DC;
    --hard: #B4483A; --hard-soft: #FBE7E4; --radius: 4px;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161F; --paper-raised: #1A2030; --ink: #E8EAF0; --ink-soft: #ACB4C4;
      --ink-faint: #6C7488; --line: #2A3142; --pine: #5CBDB5; --pine-soft: #17302E;
      --ochre: #E0A15B; --ochre-soft: #2E2417; --done: #7DC08E; --done-soft: #1B2E1F;
      --danger: #E08277; --easy: #7DC08E; --easy-soft: #1B2E1F; --medium: #E0B15B; --medium-soft: #2E2717;
      --hard: #E08277; --hard-soft: #2E1D1B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161F; --paper-raised: #1A2030; --ink: #E8EAF0; --ink-soft: #ACB4C4;
    --ink-faint: #6C7488; --line: #2A3142; --pine: #5CBDB5; --pine-soft: #17302E;
    --ochre: #E0A15B; --ochre-soft: #2E2417; --done: #7DC08E; --done-soft: #1B2E1F;
    --danger: #E08277; --easy: #7DC08E; --easy-soft: #1B2E1F; --medium: #E0B15B; --medium-soft: #2E2717;
    --hard: #E08277; --hard-soft: #2E1D1B;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100%; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 90px; }

  header.hero { margin-bottom: 18px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--pine); margin-bottom: 6px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 5vw, 28px); font-weight: 600; margin: 0; letter-spacing: -0.01em; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 16px 0; }
  .stat { background: var(--paper-raised); padding: 11px 10px; }
  .stat-num { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; }
  .stat-label { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }

  .nav-bar { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; }
  .nav-btn {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--ink);
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 14px; cursor: pointer; flex-shrink: 0;
  }
  .nav-btn:hover { border-color: var(--pine); color: var(--pine); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn:disabled:hover { border-color: var(--line); color: var(--ink); }
  .nav-position { flex: 1; text-align: center; }
  .nav-position .wk { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-faint); }
  .nav-position .day-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; margin-top: 1px; }

  .jump-row { display: flex; gap: 8px; justify-content: center; margin: 8px 0 4px; }
  .jump-row select {
    font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-soft); background: var(--paper-raised);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 7px;
  }

  .progress-track { height: 5px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 14px 0 4px; }
  .progress-fill { height: 100%; background: var(--ochre); width: 0%; transition: width .4s ease; }
  .progress-caption { font-size: 11.5px; color: var(--ink-faint); text-align: center; }

  .day-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-raised); margin-top: 18px; overflow: hidden; }
  .day-card-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .day-card-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }
  .day-card-sub { font-size: 11.5px; color: var(--ink-faint); }

  .qrow { padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .qrow:last-child { border-bottom: none; }
  .qrow.done { background: var(--done-soft); }
  .qrow.flagged:not(.done) { background: var(--ochre-soft); }

  .qrow-top { display: flex; align-items: flex-start; gap: 9px; }
  .q-check {
    appearance: none; -webkit-appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--ink-faint);
    border-radius: 4px; margin-top: 2px; flex-shrink: 0; cursor: pointer; position: relative; background: var(--paper-raised);
  }
  .q-check:checked { background: var(--done); border-color: var(--done); }
  .q-check:checked::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .q-check:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }

  .diff-badge { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; margin-top: 1px; }
  .diff-badge.E { color: var(--easy); background: var(--easy-soft); }
  .diff-badge.M { color: var(--medium); background: var(--medium-soft); }
  .diff-badge.H { color: var(--hard); background: var(--hard-soft); }

  .q-info { flex: 1; min-width: 0; }
  .q-name a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4; }
  .q-name a:hover { border-bottom-color: var(--ink-faint); }
  .qrow.done .q-name a { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); border-bottom-color: transparent; }

  .q-actions { display: flex; gap: 1px; flex-shrink: 0; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 4px 5px; font-size: 14px; color: var(--ink-faint); border-radius: var(--radius); line-height: 1; }
  .icon-btn:hover { color: var(--ink); background: var(--paper); }
  .icon-btn.on { color: var(--ochre); }
  .icon-btn.danger:hover { color: var(--danger); }

  .q-timer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-left: 27px; }
  .timer-display { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-soft); min-width: 52px; }
  .timer-display.running { color: var(--pine); }
  .timer-btn {
    font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--ink-soft); background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 8px; cursor: pointer;
  }
  .timer-btn:hover { border-color: var(--pine); color: var(--pine); }
  .timer-btn.reset:hover { border-color: var(--danger); color: var(--danger); }

  .q-edit-form { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .q-edit-form input, .q-edit-form select {
    font-family: 'Inter', sans-serif; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--paper); color: var(--ink);
  }
  .q-edit-actions { display: flex; gap: 6px; }
  .q-edit-actions button { font-family: 'Inter', sans-serif; font-size: 12px; padding: 5px 10px; border-radius: var(--radius); cursor: pointer; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); }
  .q-edit-actions button.primary { background: var(--pine); color: white; border-color: var(--pine); }

  .add-row { padding: 10px 15px; }
  .add-btn { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--pine); background: none; border: 1px dashed var(--line); border-radius: var(--radius); padding: 7px 12px; cursor: pointer; width: 100%; text-align: left; }
  .add-btn:hover { border-color: var(--pine); background: var(--pine-soft); }

  .review-empty { padding: 20px 15px; font-size: 13.5px; color: var(--ink-faint); line-height: 1.6; }
  .review-note { padding: 10px 15px 2px; font-size: 12px; color: var(--ink-faint); }

  .toolbar { display: flex; justify-content: center; margin: 22px 0 0; }
  .ghost-btn { font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--ink-faint); background: none; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
  .ghost-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-faint); line-height: 1.6; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">16 weeks · 5 questions/day · timed</div>
    <h1>DSA Tracker</h1>
  </header>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="statDone">0 / 0</div><div class="stat-label">solved</div></div>
    <div class="stat"><div class="stat-num" id="statFlag">0</div><div class="stat-label">flagged</div></div>
    <div class="stat"><div class="stat-num" id="statTime">0h</div><div class="stat-label">time logged</div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-caption" id="progressCaption">0% complete</div>

  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn">&larr; Prev</button>
    <div class="nav-position"><div class="wk" id="navWeekLabel">Week 1</div><div class="day-title" id="navDayLabel">Day 1</div></div>
    <button class="nav-btn" id="nextBtn">Next &rarr;</button>
  </div>
  <div class="jump-row">
    <select id="jumpWeek"></select>
    <select id="jumpDay"></select>
  </div>

  <div class="day-card" id="dayCard"></div>

  <div class="toolbar"><button class="ghost-btn" id="resetBtn">Reset all progress</button></div>

  <footer>Star a question you struggled with — it collects automatically on that week's Review day. Timers run while a question is in progress and pause themselves once you check it off.</footer>
</div>

const WEEKS = RAW_WEEKS.map((w, wi) => ({
  title: w.title,
  days: w.days.map((day, di) => day.map((q, qi) => ({
    id: `w${wi}-d${di}-q${qi}`, name: q[0], url: q[1], diff: q[2]
  })))
}));

let state = { done: {}, flag: {}, overrides: {}, deleted: {}, added: {}, timer: {}, pos: { week: 0, day: 0 } };
try {
  const saved = localStorage.getItem('dsa-tracker-state-v2');
  if (saved) state = Object.assign(state, JSON.parse(saved));
} catch (e) { /* start fresh */ }
if (!state.timer) state.timer = {};
if (!state.pos) state.pos = { week: 0, day: 0 };

function saveState() {
  try { localStorage.setItem('dsa-tracker-state-v2', JSON.stringify(state)); }
  catch (e) { /* storage unavailable, continue in-memory */ }
}

function effectiveQ(q) {
  const ov = state.overrides[q.id];
  return ov ? { id: q.id, name: ov.name, url: ov.url, diff: ov.diff || q.diff } : q;
}
function dayKey(wi, di) { return `w${wi}-d${di}`; }

function getDayQuestions(wi, di) {
  const base = WEEKS[wi].days[di].filter(q => !state.deleted[q.id]).map(effectiveQ);
  const extra = (state.added[dayKey(wi, di)] || []).map(q => ({ id: q.id, name: q.name, url: q.url, diff: q.diff || 'M', custom: true }));
  return base.concat(extra);
}
function getFlaggedForWeek(wi) {
  const items = [];
  for (let di = 0; di < 6; di++) {
    getDayQuestions(wi, di).forEach(q => { if (state.flag[q.id]) items.push(Object.assign({}, q, { _di: di })); });
  }
  return items;
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function getElapsed(id) {
  const t = state.timer[id];
  if (!t) return 0;
  return t.elapsed + (t.running ? Date.now() - t.start : 0);
}

function toggleDone(id) {
  state.done[id] = !state.done[id];
  if (state.done[id]) {
    const t = state.timer[id];
    if (t && t.running) { t.elapsed += Date.now() - t.start; t.running = false; t.start = null; }
  }
  saveState(); render();
}
function toggleFlag(id) { state.flag[id] = !state.flag[id]; saveState(); render(); }
function startTimer(id) {
  if (!state.timer[id]) state.timer[id] = { running: false, start: null, elapsed: 0 };
  state.timer[id].running = true; state.timer[id].start = Date.now();
  saveState(); render();
}
function pauseTimer(id) {
  const t = state.timer[id];
  if (t && t.running) { t.elapsed += Date.now() - t.start; t.running = false; t.start = null; saveState(); render(); }
}
function resetTimer(id) { state.timer[id] = { running: false, start: null, elapsed: 0 }; saveState(); render(); }

let uiEditId = null;
let uiAddOpen = {};

function startEdit(id) { uiEditId = id; render(); }
function cancelEdit() { uiEditId = null; render(); }
function saveEdit(id, name, url, diff) {
  if (!name.trim()) { cancelEdit(); return; }
  state.overrides[id] = { name: name.trim(), url: url.trim() || '#', diff: diff };
  uiEditId = null; saveState(); render();
}
function deleteQuestion(wi, di, q) {
  if (q.custom) {
    const key = dayKey(wi, di);
    state.added[key] = (state.added[key] || []).filter(x => x.id !== q.id);
  } else { state.deleted[q.id] = true; }
  saveState(); render();
}
function addQuestion(wi, di, name, url, diff) {
  if (!name.trim()) return;
  const key = dayKey(wi, di);
  if (!state.added[key]) state.added[key] = [];
  const id = 'custom-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
  state.added[key].push({ id, name: name.trim(), url: url.trim() || '#', diff: diff || 'M' });
  uiAddOpen[key] = false;
  saveState(); render();
}

function diffBadge(diff) {
  const span = document.createElement('span');
  span.className = 'diff-badge ' + diff;
  span.textContent = diff;
  return span;
}

function timerControls(q) {
  const t = state.timer[q.id] || { running: false, elapsed: 0 };
  const wrap = document.createElement('div');
  wrap.className = 'q-timer-row';

  const display = document.createElement('span');
  display.className = 'timer-display' + (t.running ? ' running' : '');
  display.dataset.timerId = q.id;
  display.textContent = formatTime(getElapsed(q.id));
  wrap.appendChild(display);

  if (!state.done[q.id]) {
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'timer-btn';
    toggleBtn.textContent = t.running ? '\u23F8 Pause' : (t.elapsed > 0 ? '\u25B6 Resume' : '\u25B6 Start');
    toggleBtn.addEventListener('click', () => t.running ? pauseTimer(q.id) : startTimer(q.id));
    wrap.appendChild(toggleBtn);
  }

  if (t.elapsed > 0 || t.running) {
    const resetBtn = document.createElement('button');
    resetBtn.className = 'timer-btn reset';
    resetBtn.textContent = '\u21BA Reset';
    resetBtn.addEventListener('click', () => resetTimer(q.id));
    wrap.appendChild(resetBtn);
  }
  return wrap;
}

function questionRow(q, wi, di, opts) {
  opts = opts || {};
  const isDone = !!state.done[q.id];
  const isFlagged = !!state.flag[q.id];
  const row = document.createElement('div');
  row.className = 'qrow' + (isDone ? ' done' : '') + (isFlagged ? ' flagged' : '');

  if (uiEditId === q.id) {
    const form = document.createElement('div');
    form.className = 'q-edit-form';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.value = q.name; nameInput.placeholder = 'Question name';
    const urlInput = document.createElement('input');
    urlInput.type = 'text'; urlInput.value = q.url; urlInput.placeholder = 'https://leetcode.com/problems/...';
    const diffSelect = document.createElement('select');
    ['E', 'M', 'H'].forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d === 'E' ? 'Easy' : d === 'M' ? 'Medium' : 'Hard';
      if (q.diff === d) opt.selected = true;
      diffSelect.appendChild(opt);
    });
    const actions = document.createElement('div');
    actions.className = 'q-edit-actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'primary'; saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => saveEdit(q.id, nameInput.value, urlInput.value, diffSelect.value));
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel'; cancelBtn.addEventListener('click', cancelEdit);
    actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
    form.appendChild(nameInput); form.appendChild(urlInput); form.appendChild(diffSelect); form.appendChild(actions);
    row.appendChild(form);
    return row;
  }

  const top = document.createElement('div');
  top.className = 'qrow-top';

  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'q-check'; cb.checked = isDone;
  cb.setAttribute('aria-label', 'Mark done: ' + q.name);
  cb.addEventListener('change', () => toggleDone(q.id));

  const badge = diffBadge(q.diff || 'M');

  const info = document.createElement('div');
  info.className = 'q-info';
  const nameDiv = document.createElement('div');
  nameDiv.className = 'q-name';
  const a = document.createElement('a');
  a.href = q.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = q.name;
  nameDiv.appendChild(a);
  info.appendChild(nameDiv);

  const actions = document.createElement('div');
  actions.className = 'q-actions';
  const flagBtn = document.createElement('button');
  flagBtn.className = 'icon-btn' + (isFlagged ? ' on' : '');
  flagBtn.title = isFlagged ? 'Unflag from review day' : 'Flag for review day';
  flagBtn.textContent = isFlagged ? '\u2605' : '\u2606';
  flagBtn.addEventListener('click', () => toggleFlag(q.id));

  const editBtn = document.createElement('button');
  editBtn.className = 'icon-btn'; editBtn.title = 'Edit / replace this question'; editBtn.textContent = '\u270E';
  editBtn.addEventListener('click', () => startEdit(q.id));

  const delBtn = document.createElement('button');
  delBtn.className = 'icon-btn danger'; delBtn.title = 'Remove this question'; delBtn.textContent = '\u2715';
  delBtn.addEventListener('click', () => { if (confirm('Remove "' + q.name + '"?')) deleteQuestion(wi, di, q); });

  actions.appendChild(flagBtn);
  if (!opts.noEdit) actions.appendChild(editBtn);
  actions.appendChild(delBtn);

  top.appendChild(cb); top.appendChild(badge); top.appendChild(info); top.appendChild(actions);
  row.appendChild(top);
  row.appendChild(timerControls(q));
  return row;
}

function addForm(wi, di) {
  const key = dayKey(wi, di);
  const wrap = document.createElement('div');
  wrap.className = 'add-row';
  if (!uiAddOpen[key]) {
    const btn = document.createElement('button');
    btn.className = 'add-btn'; btn.textContent = '+ Add a question';
    btn.addEventListener('click', () => { uiAddOpen[key] = true; render(); });
    wrap.appendChild(btn);
    return wrap;
  }
  const form = document.createElement('div');
  form.className = 'q-edit-form';
  const nameInput = document.createElement('input');
  nameInput.type = 'text'; nameInput.placeholder = 'Question name';
  const urlInput = document.createElement('input');
  urlInput.type = 'text'; urlInput.placeholder = 'https://leetcode.com/problems/...';
  const diffSelect = document.createElement('select');
  ['E', 'M', 'H'].forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d === 'E' ? 'Easy' : d === 'M' ? 'Medium' : 'Hard';
    diffSelect.appendChild(opt);
  });
  diffSelect.value = 'M';
  const actions = document.createElement('div');
  actions.className = 'q-edit-actions';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'primary'; saveBtn.textContent = 'Add';
  saveBtn.addEventListener('click', () => addQuestion(wi, di, nameInput.value, urlInput.value, diffSelect.value));
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Cancel'; cancelBtn.addEventListener('click', () => { uiAddOpen[key] = false; render(); });
  actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
  form.appendChild(nameInput); form.appendChild(urlInput); form.appendChild(diffSelect); form.appendChild(actions);
  wrap.appendChild(form);
  return wrap;
}

function clampPos() {
  if (state.pos.week < 0) state.pos.week = 0;
  if (state.pos.week > WEEKS.length - 1) state.pos.week = WEEKS.length - 1;
  if (state.pos.day < 0) state.pos.day = 0;
  if (state.pos.day > 6) state.pos.day = 6;
}

function goPrev() {
  clampPos();
  if (state.pos.day === 0) {
    if (state.pos.week > 0) { state.pos.week--; state.pos.day = 6; }
  } else { state.pos.day--; }
  saveState(); render();
}
function goNext() {
  clampPos();
  if (state.pos.day === 6) {
    if (state.pos.week < WEEKS.length - 1) { state.pos.week++; state.pos.day = 0; }
  } else { state.pos.day++; }
  saveState(); render();
}

function renderNav() {
  document.getElementById('navWeekLabel').textContent = `Week ${state.pos.week + 1} of ${WEEKS.length} \u2014 ${WEEKS[state.pos.week].title}`;
  document.getElementById('navDayLabel').textContent = DAY_LABELS[state.pos.day];
  document.getElementById('prevBtn').disabled = (state.pos.week === 0 && state.pos.day === 0);
  document.getElementById('nextBtn').disabled = (state.pos.week === WEEKS.length - 1 && state.pos.day === 6);

  const jw = document.getElementById('jumpWeek');
  if (jw.options.length !== WEEKS.length) {
    jw.innerHTML = '';
    WEEKS.forEach((w, i) => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = `Week ${i + 1}`;
      jw.appendChild(opt);
    });
  }
  jw.value = state.pos.week;

  const jd = document.getElementById('jumpDay');
  if (jd.options.length !== 7) {
    jd.innerHTML = '';
    DAY_LABELS.forEach((l, i) => {
      const opt = document.createElement('option');
      opt.value = i; opt.textContent = l;
      jd.appendChild(opt);
    });
  }
  jd.value = state.pos.day;
}

function render() {
  clampPos();
  renderNav();

  const { week: wi, day: di } = state.pos;
  const card = document.getElementById('dayCard');
  card.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'day-card-head';
  const titleDiv = document.createElement('div');
  const flagged = getFlaggedForWeek(wi);

  if (di === 6) {
    titleDiv.innerHTML = `<div class="day-card-title">Review Day</div><div class="day-card-sub">Everything flagged this week</div>`;
    head.appendChild(titleDiv);
    card.appendChild(head);
    if (flagged.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'review-empty';
      empty.textContent = "Nothing flagged this week yet. Star a question on any day (\u2606) and it'll show up here to revisit.";
      card.appendChild(empty);
    } else {
      flagged.forEach(q => card.appendChild(questionRow(q, wi, q._di, { noEdit: true })));
    }
  } else {
    const qs = getDayQuestions(wi, di);
    const solved = qs.filter(q => state.done[q.id]).length;
    titleDiv.innerHTML = `<div class="day-card-title">${DAY_LABELS[di]}</div><div class="day-card-sub">${solved}/${qs.length} solved${flagged.length ? ` \u00b7 \u2605 ${flagged.length} flagged this week` : ''}</div>`;
    head.appendChild(titleDiv);
    card.appendChild(head);
    qs.forEach(q => card.appendChild(questionRow(q, wi, di)));
    card.appendChild(addForm(wi, di));
  }

  // overall stats across everything
  let totalQ = 0, doneQ = 0, totalFlag = 0, totalMs = 0;
  WEEKS.forEach((week, w2) => {
    for (let d2 = 0; d2 < 6; d2++) {
      getDayQuestions(w2, d2).forEach(q => {
        totalQ++;
        if (state.done[q.id]) doneQ++;
        if (state.flag[q.id]) totalFlag++;
        totalMs += getElapsed(q.id);
      });
    }
  });
  document.getElementById('statDone').textContent = `${doneQ} / ${totalQ}`;
  document.getElementById('statFlag').textContent = totalFlag;
  const hrs = totalMs / 3600000;
  document.getElementById('statTime').textContent = hrs >= 1 ? hrs.toFixed(1) + 'h' : Math.round(totalMs / 60000) + 'm';
  const pct = totalQ ? Math.round((doneQ / totalQ) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCaption').textContent = pct + '% complete overall';
}

// Live tick for running timers (updates text only, no full re-render)
setInterval(() => {
  document.querySelectorAll('.timer-display[data-timer-id]').forEach(el => {
    const id = el.dataset.timerId;
    const t = state.timer[id];
    if (t && t.running) el.textContent = formatTime(getElapsed(id));
  });
}, 1000);

document.getElementById('prevBtn').addEventListener('click', goPrev);
document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('jumpWeek').addEventListener('change', (e) => { state.pos.week = parseInt(e.target.value); saveState(); render(); });
document.getElementById('jumpDay').addEventListener('change', (e) => { state.pos.day = parseInt(e.target.value); saveState(); render(); });
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all progress, timers, flags, and edits on this device? This cannot be undone.')) {
    state = { done: {}, flag: {}, overrides: {}, deleted: {}, added: {}, timer: {}, pos: { week: 0, day: 0 } };
    saveState(); render();
  }
});

render();
</script>
</body>
</html>
